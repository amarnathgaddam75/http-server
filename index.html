<!DOCTYPE html>
<html>
<head>
    <title>HTTP Server in C</title>

    <style>
        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 80px;
        }

        .box {
            width: 60%;
            margin: auto;
            background: #1e293b;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            color: #38bdf8;
        }

        .status {
            color: #22c55e;
            font-size: 20px;
            margin-top: 20px;
        }

        ul {
            text-align: left;
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>HTTP Server Built in C</h1>

        <p>
            A simple HTTP server created from scratch using socket programming.
        </p>

        <div class="status">
            Server Running Successfully
        </div>

        <h2>Features</h2>

        <ul>
            <li>Handles HTTP GET requests</li>
            <li>Serves static HTML files</li>

        </ul>

        <p>
            Created by Amar
        </p>

    </div>
